<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Actions - Community Meeting Decision Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Action Items Tracker</h1>
                <p>Track all community decisions and follow up on assigned responsibilities and deadlines.</p>
            </div>
        </div>

        <!-- Filter Card -->
        <div class="card">
            <div class="d-flex justify-between align-center flex-wrap gap-12">
                <div class="form-group" style="margin-bottom: 0; min-width: 250px;">
                    <label for="status-filter">Filter by Status:</label>
                    <select id="status-filter" class="form-control">
                        <option value="ALL">All Actions</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Overdue">Overdue (Due date passed)</option>
                    </select>
                </div>
                <div class="text-muted" id="action-stats-summary">
                    <!-- Action count summary -->
                </div>
            </div>
        </div>

        <!-- Actions List Card -->
        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Action Description</th>
                            <th>Meeting</th>
                            <th>Assigned Resident</th>
                            <th>Due Date</th>
                            <th>Current Status</th>
                            <th>Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="actions-table-body">
                        <!-- Populated by js/actions.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/actions.js"></script>
</body>
</html>
