<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Archive - Community Meeting Decision Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <div id="navbar-container"></div>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Meeting Archive</h1>
                <p>Read-only historical archive of completed and cancelled community meetings.</p>
            </div>
        </div>

        <!-- Search & Filter Card -->
        <div class="card">
            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label for="search-title">Search by Meeting Title:</label>
                    <input type="text" id="search-title" class="form-control" placeholder="Type keywords to filter by title...">
                </div>
                <div class="form-group">
                    <label for="filter-month">Filter by Month:</label>
                    <input type="month" id="filter-month" class="form-control">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button onclick="resetFilters()" class="btn btn-outline" style="width: 100%;">Reset Filters</button>
                </div>
            </div>
        </div>

        <!-- Archived Meetings Table Card -->
        <div class="card">
            <div class="d-flex justify-between align-center mb-12">
                <h2>Archived Meetings</h2>
                <span class="text-muted" id="archive-count-display">0 archived meetings</span>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Meeting Title</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Venue</th>
                            <th>Final Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="archive-table-body">
                        <!-- Populated by js/archive.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Read-Only Detail Card (when a meeting record is viewed) -->
        <div id="archive-detail-card" class="card" style="display: none;">
            <div class="d-flex justify-between align-center mb-12">
                <h3 id="archive-detail-title">Meeting Record</h3>
                <button onclick="closeArchiveDetail()" class="btn btn-outline btn-sm">Close View</button>
            </div>
            <div id="archive-detail-content">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/archive.js"></script>
</body>
</html>
